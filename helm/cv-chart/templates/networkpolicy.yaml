{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-app.fullname" . }}
  labels:
    app: {{ include "cv-app.name" . }}
spec:
  # Apply ingress controls only to pods created by this chart.
  podSelector:
    matchLabels:
      app: {{ include "cv-app.name" . }}
  policyTypes:
    - Ingress
  ingress:
    # Public website traffic routed by Service/Ingress.
    - ports:
        - protocol: TCP
          port: 80
      {{- with .Values.networkPolicy.ingress.http.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Prometheus scrape traffic for the apache-exporter sidecar.
    - ports:
        - protocol: TCP
          port: 9117
      {{- with .Values.networkPolicy.ingress.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
