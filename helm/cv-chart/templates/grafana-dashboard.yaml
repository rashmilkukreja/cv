apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-app-dashboard
  labels:
    grafana_dashboard: "1"
data:
  cv-app-dashboard.json: |
    {
      "title": "Apache CV App Dashboard",
      "panels": [

        {
          "type": "stat",
          "title": "Apache Status",
          "targets": [
            {
              "expr": "apache_up",
              "refId": "A"
            }
          ]
        },

        {
          "type": "graph",
          "title": "Requests per Second",
          "targets": [
            {
              "expr": "rate(apache_accesses_total[1m])",
              "refId": "B"
            }
          ]
        },

        {
          "type": "graph",
          "title": "Traffic (KB/sec)",
          "targets": [
            {
              "expr": "rate(apache_sent_kilobytes_total[1m])",
              "refId": "C"
            }
          ]
        },

        {
          "type": "graph",
          "title": "Worker Status",
          "targets": [
            {
              "expr": "apache_workers",
              "legendFormat": "{{`{{state}}`}}",
              "refId": "D"
            }
          ]
        },

        {
          "type": "graph",
          "title": "Scoreboard",
          "targets": [
            {
              "expr": "apache_scoreboard",
              "legendFormat": "{{`{{state}}`}}",
              "refId": "E"
            }
          ]
        }

      ],
      "schemaVersion": 16,
      "version": 1
    }
