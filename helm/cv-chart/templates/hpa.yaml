{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cv-app.fullname" . }}
spec:
  # Scale the CV app Deployment, not the monitoring stack.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cv-app.fullname" . }}
  # Boundaries protect the app from scaling below availability or above budget.
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    # Requires metrics-server and CPU requests on every container in the pod.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
