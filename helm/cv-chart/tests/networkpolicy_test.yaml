suite: NetworkPolicy Tests
# NetworkPolicy tests protect pod-level ingress boundaries for the CV app.
templates:
  - templates/networkpolicy.yaml

tests:
  - it: should render a network policy by default
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cv-app
      - equal:
          path: spec.podSelector.matchLabels.app
          value: cv-app

  - it: should allow only http and metrics ingress ports
    asserts:
      - equal:
          path: spec.policyTypes[0]
          value: Ingress
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 80
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9117

  - it: should support http source restrictions
    set:
      networkPolicy.ingress.http.from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: should not render when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
