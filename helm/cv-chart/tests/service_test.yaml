suite: Service Tests
templates:
  - templates/service.yaml

tests:
  - it: should expose correct port
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80

  - it: should have correct service type
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: should expose the exporter metrics port
    asserts:
      - equal:
          path: spec.ports[1].name
          value: metrics
      - equal:
          path: spec.ports[1].port
          value: 9117
