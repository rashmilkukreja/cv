suite: Tempo Datasource Tests
# Tempo datasource tests ensure Grafana can discover and query traces.
templates:
  - templates/tempo-datasource.yaml

tests:
  - it: should render tempo datasource by default
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cv-app-tempo-datasource
      - equal:
          path: metadata.labels.grafana_datasource
          value: "1"
      - matchRegex:
          path: data["tempo-datasource.yaml"]
          pattern: "type: tempo"
      - matchRegex:
          path: data["tempo-datasource.yaml"]
          pattern: "url: \"http://tempo-query-frontend.observability.svc.cluster.local:3100\""

  - it: should support a custom tempo datasource url
    set:
      tempo.datasource.url: http://tempo.observability.svc.cluster.local:3100
    asserts:
      - matchRegex:
          path: data["tempo-datasource.yaml"]
          pattern: "url: \"http://tempo.observability.svc.cluster.local:3100\""

  - it: should not render when datasource is disabled
    set:
      tempo.datasource.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when tracing is disabled
    set:
      tracing.enabled: false
    asserts:
      - hasDocuments:
          count: 0
