name: Deploy to EKS

# Compatibility workflow kept for anyone looking for the old deploy entrypoint.
# The actual build/test/deploy pipeline now lives in ci-cd.yaml.
on:
  # Manual only, so this file does not accidentally deploy stale behavior.
  workflow_dispatch:

jobs:
  note:
    name: Use CI/CD Deploy to EKS
    runs-on: ubuntu-latest
    steps:
      - name: Deployment workflow moved
        # Fail-safe pointer instead of duplicating deployment logic in two workflows.
        run: echo "Use .github/workflows/ci-cd.yaml for the full build, test, and EKS deployment pipeline."
