<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .aws { fill: #eef7ff; stroke: #60a5fa; stroke-width: 2; rx: 16; }
      .k8s { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 16; }
      .obs { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 16; }
      .cicd { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; rx: 16; }
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .h { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .t { font: 400 19px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .mono { font: 600 17px Menlo, Consolas, monospace; fill: #1e293b; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow-green); stroke-dasharray: 10 8; }
      .arrow3 { stroke: #ea580c; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); stroke-dasharray: 10 8; }
      .iconText { font: 700 34px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .badge { fill: #0f172a; rx: 11; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="80" y="75" class="title">CV App Deployment Architecture on AWS EKS</text>
  <text x="80" y="112" class="subtitle">Terraform infrastructure, GitHub Actions CI/CD, Helm deployment, ALB ingress, Prometheus metrics, and Grafana dashboards</text>

  <rect x="70" y="155" width="315" height="585" class="cicd"/>
  <text x="105" y="205" class="h">CI/CD Pipeline</text>
  <circle cx="125" cy="260" r="35" fill="#111827"/>
  <text x="125" y="262" class="iconText">GH</text>
  <text x="175" y="250" class="h">GitHub Actions</text>
  <text x="175" y="280" class="t">Push to main / manual run</text>
  <rect x="105" y="325" width="245" height="72" class="panel"/>
  <text x="130" y="355" class="mono">docker build</text>
  <text x="130" y="382" class="small">Push rakukrej/devops-cv:&lt;sha&gt;</text>
  <rect x="105" y="425" width="245" height="72" class="panel"/>
  <text x="130" y="455" class="mono">helm lint + test</text>
  <text x="130" y="482" class="small">Render chart before deploy</text>
  <rect x="105" y="525" width="245" height="88" class="panel"/>
  <text x="130" y="555" class="mono">OIDC assume role</text>
  <text x="130" y="582" class="small">GitHubActionsEksDeploy</text>
  <text x="130" y="606" class="small">No long-lived AWS keys</text>
  <rect x="105" y="645" width="245" height="58" class="panel"/>
  <text x="130" y="680" class="mono">helm upgrade --install</text>

  <rect x="470" y="155" width="390" height="585" class="aws"/>
  <text x="505" y="205" class="h">AWS Foundation</text>
  <rect x="505" y="240" width="320" height="445" fill="#ffffff" stroke="#38bdf8" stroke-width="2" rx="16"/>
  <text x="535" y="282" class="h">VPC</text>
  <rect x="535" y="315" width="125" height="130" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" rx="12"/>
  <text x="552" y="348" class="t">Public</text>
  <text x="552" y="378" class="t">Subnets</text>
  <text x="552" y="414" class="small">ALB</text>
  <rect x="675" y="315" width="125" height="130" fill="#ecfdf5" stroke="#86efac" stroke-width="2" rx="12"/>
  <text x="692" y="348" class="t">Private</text>
  <text x="692" y="378" class="t">Subnets</text>
  <text x="692" y="414" class="small">EKS nodes</text>
  <rect x="535" y="480" width="265" height="70" class="panel"/>
  <text x="565" y="510" class="mono">IAM + OIDC</text>
  <text x="565" y="537" class="small">IRSA and GitHub deploy role</text>
  <rect x="535" y="585" width="265" height="70" class="panel"/>
  <text x="565" y="615" class="mono">AWS Load Balancer</text>
  <text x="565" y="642" class="small">Controller reconciles Ingress</text>

  <rect x="945" y="155" width="395" height="585" class="k8s"/>
  <text x="980" y="205" class="h">EKS Cluster</text>
  <rect x="980" y="240" width="325" height="90" class="panel"/>
  <text x="1010" y="275" class="mono">Namespace: cv</text>
  <text x="1010" y="305" class="small">Helm release: cv</text>
  <rect x="980" y="365" width="150" height="112" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="14"/>
  <text x="1005" y="403" class="h">Ingress</text>
  <text x="1005" y="435" class="small">Class: alb</text>
  <text x="1005" y="461" class="small">Internet-facing</text>
  <rect x="1155" y="365" width="150" height="112" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="14"/>
  <text x="1180" y="403" class="h">Service</text>
  <text x="1180" y="435" class="small">NodePort 30007</text>
  <text x="1180" y="461" class="small">Metrics 9117</text>
  <rect x="980" y="525" width="325" height="115" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="14"/>
  <text x="1010" y="565" class="h">Deployment: cv-cv-app</text>
  <text x="1010" y="598" class="small">Container: Apache CV website :80</text>
  <text x="1010" y="624" class="small">Sidecar: apache-exporter :9117</text>
  <rect x="980" y="665" width="325" height="50" class="panel"/>
  <text x="1010" y="697" class="mono">HPA: cpu 50%, 1-5 pods</text>

  <rect x="70" y="780" width="1270" height="70" class="obs"/>
  <text x="105" y="823" class="h">Observability:</text>
  <text x="275" y="823" class="t">ServiceMonitor scrapes Apache exporter metrics → Prometheus stores and evaluates rules → Grafana visualizes CV app health and traffic</text>

  <rect x="1390" y="255" width="145" height="95" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="16"/>
  <text x="1428" y="294" class="h">Users</text>
  <text x="1415" y="326" class="small">HTTP / ALB URL</text>
  <rect x="1390" y="500" width="145" height="95" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="16"/>
  <text x="1420" y="540" class="h">Grafana</text>
  <text x="1418" y="572" class="small">Port-forward 3000</text>

  <path d="M385 525 C420 525 430 525 470 525" class="arrow"/>
  <text x="392" y="505" class="small">deploy</text>
  <path d="M860 620 C900 620 910 620 945 620" class="arrow"/>
  <text x="875" y="600" class="small">Helm manifests</text>
  <path d="M1305 420 C1345 420 1355 305 1390 305" class="arrow"/>
  <text x="1322" y="374" class="small">public traffic</text>
  <path d="M1138 640 C1138 760 575 760 575 780" class="arrow2"/>
  <text x="830" y="748" class="small">metrics scrape</text>
  <path d="M1138 780 C1245 780 1320 548 1390 548" class="arrow3"/>
  <text x="1280" y="675" class="small">dashboards</text>

  <rect x="80" y="125" width="350" height="35" class="badge"/>
  <text x="100" y="148" class="small" fill="#ffffff">GitHub Actions → Docker Hub → EKS → ALB → Prometheus/Grafana</text>
</svg>
